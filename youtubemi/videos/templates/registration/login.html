<!DOCTYPE html>
<html lang="uz">
<head>
  {% load static %}
  {% load widget_tweaks %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kirish</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #343a40;
    }

    .login-container {
      background: #fff;
      padding: 3rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 100%;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 700;
      font-size: 2rem;
      color: #222;
      letter-spacing: 1px;
    }

    /* Floating label uslubi */
    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background-color: #f8f9fa;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:focus {
      border-color: #007bff;
      background-color: #fff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
    }

    /* Bo'sh joy placeholder uchun */
    .form-group input::placeholder {
      color: transparent;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      background-color: white;
      padding: 0 8px;
      color: #6c757d;
      font-size: 1rem;
      font-weight: 600;
      pointer-events: none;
      transition: 0.3s ease all;
      border-radius: 6px;
      user-select: none;
    }

    /* Label yuqoriga ko‘tariladi */
    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -10px;
      left: 12px;
      font-size: 0.8rem;
      color: #007bff;
    }

    /* Xatoliklar */
    .form-error {
      margin-top: 0.25rem;
      color: #dc3545;
      font-size: 0.875rem;
      font-weight: 600;
    }

    /* Submit tugma */
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.15rem;
      border-radius: 12px;
      background: linear-gradient(90deg, #007bff 0%, #0056b3 100%);
      border: none;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-login:hover {
      background: linear-gradient(90deg, #0056b3 0%, #003d80 100%);
      box-shadow: 0 8px 20px rgba(0, 86, 179, 0.6);
    }

    /* Responsiv */
    @media (max-width: 480px) {
      .login-container {
        margin: 1rem;
        padding: 2rem 1.5rem;
      }

      .login-container h2 {
        font-size: 1.5rem;
      }

      .btn-login {
        font-size: 1rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Kirish</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          {{ field|add_class:"form-control" }} 
          <!-- Django form inputga class qo'shish uchun add_class filter (django-widget-tweaks kutubxonasi kerak) -->
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {% if field.errors %}
            <div class="form-error">
              {{ field.errors|striptags }}
            </div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn-login">Kirish</button>
    </form>
  </div>
</body>
</html>
