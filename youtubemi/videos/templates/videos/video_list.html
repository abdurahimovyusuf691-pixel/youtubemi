<!DOCTYPE html>
<html>
<head>
    <title>Video ro'yxati</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
{% extends 'videos/base.html' %}
{% block title %}Videolar{% endblock %}

{% block content %}
<h2>Videolar</h2>
<div class="row">
  {% for video in videos %}
  <div style="margin-bottom: 20px;" class="col-md-4">
    <div class="card video-card">
      <a href="{% url 'videos:video_detail' video.pk %}">
        <img src="{% if video.thumbnail %}{{ video.thumbnail.url }}{% else %}/static/images/default-thumb.jpg{% endif %}" 
     class="card-img-top video-thumb" alt="{{ video.title }}">

      </a>
      <div class="card-body">
        <h5 class="card-title">{{ video.title }}</h5>
        <p class="card-text text-muted">{{ video.uploaded_at|date:"d M Y" }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
